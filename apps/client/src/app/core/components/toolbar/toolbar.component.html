<div class="toolbar-container">
  <h1>
    <div class="user-icon" (click)="toggleMenu()">
      <svg-icon [svgName]="'user'"></svg-icon>
    </div>
    {{ title }}
    <p class="badge">{{ badgeCount }}</p>
  </h1>
  <button class="default-button" (click)="action($event)">
    <p>{{ actionTitle }}</p>
    <i [class]="actionIcon"></i>
  </button>
</div>
<floating-widget
  [(visible)]="menuOpen"
  [widgetItems]="widgetItems()"
  [animationDisabled]="true"
  [width]="'150px'"
  [left]="'10px'"
></floating-widget>
